<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autoevaluación de proyectos ABP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
/* VOICE: cálida, clara y de claustro; una herramienta de trabajo, no un cartel.
   IDEA: la diana de autoevaluación que la Fundación usa en el aula, llevada al proyecto.
   PICTURE: una diana viva de 9 sectores que crece mientras el equipo responde.
   COLOUR and TYPE: turquesa dominante, amarillo sol de apoyo, coral de acento; semáforo para los niveles. Lexend + Nunito Sans.
   LAYOUT: preguntas en una columna tranquila; la diana fija a la derecha; informe al final. */
:root{color-scheme:light dark;
--bg:light-dark(#f7f8f5,#0d1a1c);--card:light-dark(#ffffff,#132629);--ink:light-dark(#11272a,#e6f0ef);--soft:light-dark(#566a6c,#9fb5b4);
--line:light-dark(#dfe6e4,#24393c);--teal:light-dark(#0b7377,#4cc3c0);--teal2:light-dark(#e2f2f1,#16393b);--sun:#f2b632;--coral:light-dark(#d94b3f,#ff7a6c);
--l4:#2e9e5b;--l3:#93bf35;--l2:#efa12c;--l1:#d9483b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Nunito Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Lexend,system-ui,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,4vw,42px)}h2{font-size:24px}h3{font-size:19px}
.top{background:var(--teal);color:#fff;padding:22px max(5vw,16px) 22px}
.top p{margin:8px 0 0;max-width:64ch;opacity:.92}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.lang{min-height:40px;padding:6px 14px;border-radius:999px;border:2px solid rgba(255,255,255,.7);background:transparent;color:#fff;font:600 15px Lexend,sans-serif;cursor:pointer}
.lang[aria-pressed=true]{background:#fff;color:#0b7377;border-color:#fff}
.wrap{max-width:1240px;margin:0 auto;padding:24px max(4vw,16px) 40px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px;margin-top:14px}
label{display:block;font-size:14px;font-weight:700;color:var(--soft)}
input,select,textarea{width:100%;font:16px "Nunito Sans",sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:4px;min-height:44px}
textarea{min-height:70px;resize:vertical}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.stages{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{font:600 16px Lexend,sans-serif;min-height:44px;padding:8px 18px;border-radius:999px;border:2px solid var(--teal);background:transparent;color:var(--teal);cursor:pointer}
.chip[aria-pressed=true]{background:var(--teal);color:#fff}
.blk{margin-top:22px}
.bh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--teal2);color:var(--teal);display:grid;place-items:center;font:700 17px Lexend,sans-serif}
.bh small{display:block;color:var(--soft);font-size:14px}
.it{padding:14px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.q{margin:0 0 4px;font-weight:600}
.hint{font-size:14px;color:var(--soft);margin:0 0 6px;padding-left:10px;border-left:3px solid var(--sun)}
body[data-stage=i] .h-p,body[data-stage=i] .h-s,body[data-stage=p] .h-i,body[data-stage=p] .h-s,body[data-stage=s] .h-i,body[data-stage=s] .h-p{display:none}
.lv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.lv button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 14px "Nunito Sans",sans-serif;cursor:pointer;padding:6px 4px}
.lv button:hover{border-color:var(--soft)}
.lv .l4[aria-pressed=true]{background:var(--l4);border-color:var(--l4);color:#fff}
.lv .l3[aria-pressed=true]{background:var(--l3);border-color:var(--l3);color:#10230a}
.lv .l2[aria-pressed=true]{background:var(--l2);border-color:var(--l2);color:#2b1700}
.lv .l1[aria-pressed=true]{background:var(--l1);border-color:var(--l1);color:#fff}
details.notes{margin-top:10px}details.notes summary{cursor:pointer;color:var(--teal);font-weight:700;font-size:15px;min-height:32px}
aside{position:sticky;top:16px}
.fig{position:relative;height:320px;margin:6px -6px 0}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.big{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.big b{font:700 clamp(40px,6vw,54px)/1 Lexend,sans-serif;color:var(--teal);white-space:nowrap}
.big span{color:var(--soft);font-size:15px}
.rows{list-style:none;padding:0;margin:12px 0 0}
.rows li{display:grid;grid-template-columns:22px minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:14px;padding:3px 0}
.rows a{color:inherit;text-decoration:none}.rows a:hover{text-decoration:underline}
.bar{grid-column:2/4;height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:-2px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s}
.rows em{font-style:normal;text-align:right;font-weight:700;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--soft);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.report{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px) 40px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:16px}
.cols ul{padding-left:20px;margin:10px 0 0}.cols li{margin-bottom:10px}
.cols li small{display:block;color:var(--soft)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:6px;color:#fff;white-space:nowrap}
.priority{border-left:6px solid var(--coral)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{min-height:44px;padding:10px 18px;border-radius:10px;border:0;background:var(--teal);color:#fff;font:600 16px Lexend,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.msg{color:var(--teal);font-weight:700;align-self:center}
.empty{color:var(--soft);font-style:italic}
.evh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.help{color:var(--soft);font-size:14px;margin:10px 0 0}
.filebtn{display:inline-flex;align-items:center;font-size:16px;color:var(--teal)}
.evlist{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.evlist li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.evlist li.cur{border:2px solid var(--teal);background:var(--teal2)}
.evlist b{display:block;font-family:Lexend,sans-serif;font-weight:600}
.evlist small{color:var(--soft);font-size:14px}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sm{min-height:40px;padding:6px 14px;border-radius:9px;border:1.5px solid var(--teal);background:var(--card);color:var(--teal);font:600 15px "Nunito Sans",sans-serif;cursor:pointer}
.sm.del{border-color:var(--line);color:var(--soft)}.sm.danger{background:var(--l1);border-color:var(--l1);color:#fff}
.pill{font-size:13px;font-weight:700;color:var(--teal)}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,10px);max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
footer{border-top:1px solid var(--line);padding:18px max(5vw,16px);color:var(--soft);font-size:14px;text-align:center}
@media(max-width:960px){.wrap{grid-template-columns:minmax(0,1fr)}aside{position:static;order:-1}}
@media(max-width:600px){.lv{grid-template-columns:repeat(2,minmax(0,1fr))}.fig{height:280px}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
@media print{.noprint,details.notes:not([open]){display:none!important}body{background:#fff;color:#000}.top{background:#fff;color:#000;border-bottom:3px solid #0b7377}.wrap{display:block}aside{position:static;break-inside:avoid}.card{border:1px solid #ccc;break-inside:avoid-page}.lv button:not([aria-pressed=true]){opacity:.35}}
</style>
</head>
<body data-stage="p">
<header class="top">
  <div class="langs noprint" role="group" aria-label="Idioma / Idioma / Llengua">
    <button class="lang" data-lang="es">Castellano</button>
    <button class="lang" data-lang="gl">Galego</button>
    <button class="lang" data-lang="ca">Català</button>
    <button class="lang" id="install" data-t="install" hidden style="margin-left:auto"></button>
  </div>
  <h1 data-t="title"></h1>
  <p data-t="intro"></p>
</header>

<main class="wrap">
  <section>
    <div class="card noprint" id="evals">
      <div class="evh">
        <h2 data-t="mis"></h2>
        <div class="acts">
          <button class="btn" id="new" data-t="nueva"></button>
          <label class="btn ghost filebtn" tabindex="0" id="openlbl"><span data-t="abrirArch"></span><input type="file" id="file" accept=".json,application/json" hidden></label>
          <button class="btn ghost dlx" id="savefile" data-t="guardarArch" hidden></button>
        </div>
      </div>
      <p class="help" data-t="listHelp"></p>
      <ul class="evlist" id="evlist"></ul>
    </div>
    <div class="card" style="margin-top:22px">
      <h2 data-t="datos"></h2>
      <div style="margin-top:14px">
        <label id="lbl-stage" data-t="etapa"></label>
        <div class="stages" role="group" aria-labelledby="lbl-stage">
          <button class="chip" data-stage="i"></button>
          <button class="chip" data-stage="p"></button>
          <button class="chip" data-stage="s"></button>
        </div>
      </div>
      <div class="grid">
        <div><label for="m-titulo" data-t="lTitulo"></label><input id="m-titulo" data-m="titulo"></div>
        <div><label for="m-curso" data-t="lCurso"></label><input id="m-curso" data-m="curso"></div>
        <div><label for="m-areas" data-t="lAreas"></label><input id="m-areas" data-m="areas"></div>
        <div><label for="m-centro" data-t="lCentro"></label><input id="m-centro" data-m="centro"></div>
        <div><label for="m-quien" data-t="lQuien"></label><select id="m-quien" data-m="quien" data-o="quienO"></select></div>
        <div><label for="m-momento" data-t="lMomento"></label><select id="m-momento" data-m="momento" data-o="momO"></select></div>
      </div>
    </div>
    <div id="blocks"></div>
  </section>

  <aside>
    <div class="card">
      <h3 data-t="diana"></h3>
      <div class="fig"><svg id="diana" role="img"></svg></div>
      <div class="big"><b id="pct">—</b><span id="done"></span></div>
      <div class="legend" id="legend"></div>
      <ul class="rows" id="rows"></ul>
    </div>
  </aside>
</main>

<section class="report" id="informe">
  <div class="card">
    <h2 id="rep-title"></h2>
    <p id="rep-sub" style="color:var(--soft);margin:6px 0 0"></p>
    <div class="card priority" style="margin-top:16px"><h3 data-t="empezar"></h3><ul id="top3" style="padding-left:20px;margin:10px 0 0"></ul></div>
    <div class="cols">
      <div><h3 style="color:var(--l4)" data-t="fuertes"></h3><ul id="fuertes"></ul></div>
      <div><h3 style="color:var(--coral)" data-t="mejoras"></h3><ul id="mejoras"></ul></div>
    </div>
    <h3 style="margin-top:24px" data-t="proximo"></h3>
    <div class="grid">
      <div><label for="f-seguir" data-t="seguir"></label><textarea id="f-seguir" data-m="seguir"></textarea></div>
      <div><label for="f-comenzar" data-t="comenzar"></label><textarea id="f-comenzar" data-m="comenzar"></textarea></div>
      <div><label for="f-parar" data-t="parar"></label><textarea id="f-parar" data-m="parar"></textarea></div>
    </div>
    <div class="btns noprint">
      <button class="btn dlx" id="word" data-t="word" hidden></button>
      <button class="btn ghost" id="copy" data-t="copy"></button>
      <button class="btn ghost" id="print" hidden data-t="print"></button>
    </div>
  </div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<footer>Isabel González Mosquera · CPR Plurilingüe Divina Pastora Ourense · Fundación Ana Mogas</footer>

/* ---------- ESTADO: varias evaluaciones en este navegador ---------- */
const KEY='autoeval-abp-v2';
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const blank=st=>({stage:st||'p',m:{},a:{},n:{},upd:Date.now()});
let store={lang:'es',cur:null,list:{}};
try{const r=localStorage.getItem(KEY);
 if(r)store=Object.assign(store,JSON.parse(r));
 else{const o=localStorage.getItem('autoeval-abp-v1');if(o){const s=JSON.parse(o),id=nid();store.lang=s.lang||'es';store.list[id]={stage:s.stage||'p',m:s.m||{},a:s.a||{},n:s.n||{},upd:Date.now()};store.cur=id}}}catch(e){}
if(!T[store.lang])store.lang='es';
if(!store.cur||!store.list[store.cur]){const id=nid();store.list[id]=blank();store.cur=id}
let S=store.list[store.cur];
const fix=s=>{['quien','momento'].forEach(k=>{if(s.m[k]!=null&&!/^[0-2]$/.test(s.m[k]))s.m[k]='0'})};
Object.values(store.list).forEach(fix);
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const save=()=>{S.upd=Date.now();persist()};
const t=()=>T[store.lang],B=()=>D[store.lang];
const total=D.es.reduce((s,b)=>s+b.q.length,0);
const col=v=>v>=3.5?'var(--l4)':v>=2.75?'var(--l3)':v>=1.75?'var(--l2)':'var(--l1)';
const lvOf=v=>v>=3.5?4:v>=2.75?3:v>=1.75?2:1;
const lvName=v=>t().lv[v-1];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avgOf=(s,bi)=>{const v=D.es[bi].q.map((_,ii)=>s.a[bi+'-'+ii]).filter(Boolean);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0};
const blockAvg=bi=>avgOf(S,bi);
const pctOf=s=>{const v=Object.values(s.a);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/(4*v.length)*100):0};
const pctNow=()=>pctOf(S);
const slug=x=>(String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40))||'proyecto';
const toastEl=document.getElementById('toast');let tt;
const toast=x=>{toastEl.textContent=x;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('on'),3200)};

 <div class="bh"><span class="num">${bi+1}</span><div><h3>${b.n}</h3><small>${b.d}</small></div></div>
 ${b.q.map(([q,,h],ii)=>{const k=bi+'-'+ii;const hs=h?Object.entries(h).map(([s,x])=>`<p class="hint h-${s}">${x}</p>`).join(''):'';
 return `<div class="it"><p class="q" id="q${k}">${q}</p>${hs}<div class="lv" role="group" aria-labelledby="q${k}">${[4,3,2,1].map(v=>`<button class="l${v}" data-k="${k}" data-v="${v}" aria-pressed="false">${lvName(v)}</button>`).join('')}</div></div>`}).join('')}
 <details class="notes"${S.n[bi]?' open':''}><summary>${t().notes}</summary><textarea data-n="${bi}" aria-label="${t().notes} ${bi+1}"></textarea></details>

const renderList=()=>{const L=t(),loc={es:'es-ES',gl:'gl-ES',ca:'ca-ES'}[store.lang];

 document.getElementById('evlist').innerHTML=ids.map(id=>{const e=store.list[id],cur=id===store.cur,n=Object.keys(e.a).length;

const svg=document.getElementById('diana');
const dianaSVG=(W,H,P)=>{const cx=W/2,cy=H/2,R=Math.min(W,H)/2-(P.narrow?26:44),N=D.es.length;
 const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
 let o='';
 for(let r=4;r>=1;r--)o+=`<circle cx="${cx}" cy="${cy}" r="${R*r/4}" fill="${P.ring[r-1]}" fill-opacity="${0.07+0.03*r}" stroke="${P.line}"/>`;
 for(let i=0;i<N;i++){const[x,y]=pt(i,R);o+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${P.line}"/>`;
  const[lx,ly]=pt(i,R+(P.narrow?14:24));const anc=Math.abs(lx-cx)<8?'middle':lx>cx?'start':'end';
  o+=`<text x="${lx}" y="${ly}" text-anchor="${anc}" dominant-baseline="middle" font-size="${P.narrow?12:13}" font-weight="700" fill="${P.text}" font-family="${P.font}">${P.narrow?i+1:(i+1)+'. '+esc(B()[i].k)}</text>`}
 const av=D.es.map((_,i)=>blockAvg(i));
 if(av.some(v=>v)){const p=av.map((v,i)=>pt(i,R*v/4).map(n=>n.toFixed(1)).join(',')).join(' ');
  o+=`<polygon points="${p}" fill="${P.teal}" fill-opacity=".28" stroke="${P.teal}" stroke-width="2.5" stroke-linejoin="round"/>`;
  av.forEach((v,i)=>{if(v){const[x,y]=pt(i,R*v/4);o+=`<circle cx="${x}" cy="${y}" r="5" fill="${P.ring[lvOf(v)-1]}" stroke="${P.card}" stroke-width="2"/>`}})}
 return o};
const draw=()=>{const W=svg.clientWidth,H=svg.clientHeight;if(!W)return;
 svg.innerHTML=dianaSVG(W,H,{ring:['var(--l1)','var(--l2)','var(--l3)','var(--l4)'],line:'var(--line)',text:'var(--soft)',teal:'var(--teal)',card:'var(--card)',font:'Nunito Sans,sans-serif',narrow:W<480})};
const ro=new ResizeObserver(draw);ro.observe(svg);

const update=()=>{const L=t(),n=Object.keys(S.a).length,pct=pctNow();
 document.body.dataset.stage=S.stage;
 document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.stage===S.stage));
 document.querySelectorAll('.lv button').forEach(b=>b.setAttribute('aria-pressed',S.a[b.dataset.k]==+b.dataset.v));
 document.getElementById('pct').textContent=n?pct+' %':'—';
 document.getElementById('done').textContent=n?L.val(n,total):L.noResp;
 document.getElementById('rows').innerHTML=B().map((b,i)=>{const v=blockAvg(i);return `<li><span style="font-weight:700;color:var(--teal)">${i+1}</span><a href="#b${i}">${b.k}</a><em>${v?v.toFixed(1):'–'}</em><span></span><span class="bar"><i style="width:${v/4*100}%;background:${v?col(v):'transparent'}"></i></span></li>`}).join('');
 draw();
 const strong=[],weak=[];
 B().forEach((b,bi)=>b.q.forEach(([q,m],ii)=>{const v=S.a[bi+'-'+ii];if(v===4)strong.push({b:b.k,q});else if(v)weak.push({b:b.k,q,m,v})}));
 weak.sort((x,y)=>x.v-y.v);
 const tag=v=>`<span class="tag" style="background:var(--l${v})">${lvName(v)}</span>`;
 document.getElementById('fuertes').innerHTML=strong.length?strong.map(s=>`<li>${s.q}<small>${s.b}</small></li>`).join(''):`<li class="empty">${L.emptyF}</li>`;
 document.getElementById('mejoras').innerHTML=weak.length?weak.map(w=>`<li>${tag(w.v)}${w.m}<small>${w.b}: ${w.q}</small></li>`).join(''):`<li class="empty">${L.emptyM}</li>`;
 const low=B().map((b,i)=>({k:b.n,v:blockAvg(i)})).filter(x=>x.v&&x.v<3.5).sort((a,b)=>a.v-b.v).slice(0,3);
 document.getElementById('top3').innerHTML=low.length?low.map(x=>`<li><b>${x.k}</b> ${L.media(x.v.toFixed(1))}</li>`).join(''):`<li class="empty">${n?L.allGood:L.emptyTop}</li>`;
 document.getElementById('rep-title').textContent=L.rep+(S.m.titulo?` «${S.m.titulo}»`:'');
 document.getElementById('rep-sub').textContent=[L.st[S.stage],S.m.curso,S.m.areas,L.quienO[+(S.m.quien||0)],L.momO[+(S.m.momento||0)],n?L.logro(pct):''].filter(Boolean).join(' · ');
 save();renderList()};

  if(d.n&&typeof d.n==='object')Object.entries(d.n).forEach(([k,v])=>{if(D.es[+k]&&typeof v==='string')s.n[k]=v.slice(0,8000)});

/* ---------- DESCARGAS (Claude: capacidad downloads · GitHub: enlace normal) ---------- */
let dl=null,anchorOK=false;
try{anchorOK=window.self===window.top}catch(e){}
const showDl=()=>document.querySelectorAll('.dlx').forEach(b=>b.hidden=!(dl||anchorOK));
showDl();
const tryClaude=(n=0)=>{if(window.claude&&typeof window.claude.use==='function'){window.claude.use('downloads').then(x=>{dl=x;showDl()}).catch(()=>{})}else if(n<20)setTimeout(()=>tryClaude(n+1),250)};
if(!anchorOK)tryClaude();
const saveFile=async(name,data)=>{const L=t();
 if(dl){try{await dl.save({filename:name,data});toast(L.saved)}catch(e){const c=e&&e.code;
   if(c==='declined')toast(L.declined);else{toast(L.dlErr);if(['unavailable','not_granted','capability_disabled','capability_removed','host_unavailable'].includes(c)){dl=null;showDl()}}}return}
 const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast(L.saved)};

document.getElementById('savefile').addEventListener('click',()=>{

 const low=B().map((b,i)=>({k:b.n,v:blockAvg(i)})).filter(x=>x.v&&x.v<3.5).sort((a,b)=>a.v-b.v).slice(0,3);

 [['seguir',L.seguir],['comenzar',L.comenzar],['parar',L.parar]].forEach(([k,lab])=>body.push(new Paragraph({spacing:{after:100},children:[new TextRun({text:lab+': ',bold:true}),new TextRun(S.m[k]||'—')]})));

    if(a&&a<4)kids.push(new Paragraph({children:[new TextRun({text:W.mej+': ',bold:true,italics:true,color:'B5402F',size:20}),new TextRun({text:m,italics:true,size:20})]}));

  if(S.n[bi])body.push(new Paragraph({spacing:{before:100,after:160},children:[new TextRun({text:W.obs+': ',bold:true}),new TextRun(S.n[bi])]}));

 const doc=new Document({creator:'Isabel González Mosquera',title:W.title,
